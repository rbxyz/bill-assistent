  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

BF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Pixelify Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"410b317f-42d7-4ca8-ba67-fa51076d1ff5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body { margin: 0; background: #141413; }\n    .px { image-rendering: pixelated; image-rendering: crisp-edges; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: #141413; color: #e8e3d8; font-family: system-ui, -apple-system, sans-serif; padding: 40px 24px 64px;\">\n  <div style=\"max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;\">\n\n    <header style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <div style=\"font: 600 24px 'Pixelify Sans', monospace; letter-spacing: 1px; color: #c77257;\">Blob invasor · animado<\u002Fdiv>\n      <div style=\"font-size: 12px; color: #8a8478; letter-spacing: 0.3px;\">11×8 · 2 cores · nearest-neighbor · march de 2 frames · pixels nítidos<\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start;\">\n      <!-- arena com o invasor se movendo -->\n      <div id=\"inv-arena\" style=\"position: relative; width: 100%; height: 320px; background-color: #1f1f1d; background-image: linear-gradient(#262624 1px, transparent 1px), linear-gradient(90deg, #262624 1px, transparent 1px); background-size: 24px 24px; border: 1px solid #2c2c29; border-radius: 12px; overflow: hidden;\">\n        {{ arena }}\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"background: #1f1f1d; border: 1px solid #2c2c29; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font: 600 12px 'Pixelify Sans', monospace; color: #8a8478; letter-spacing: 1px; text-transform: uppercase;\">Animações<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ m.set }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #1f1f1d; border: 1px solid #2c2c29; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font: 600 12px 'Pixelify Sans', monospace; color: #8a8478; letter-spacing: 1px; text-transform: uppercase;\">Paleta<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 14px; height: 14px; background: #c77257; display: inline-block; border-radius: 2px;\"><\u002Fspan><span style=\"font: 11px monospace; color: #b3ad9f;\">Corpo #C77257<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 14px; height: 14px; background: #1f1f1d; display: inline-block; border-radius: 2px; border: 1px solid #3a3a36;\"><\u002Fspan><span style=\"font: 11px monospace; color: #b3ad9f;\">Fundo/olhos #1F1F1D<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- folha de frames -->\n    <section style=\"display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"font: 600 15px 'Pixelify Sans', monospace; color: #ddcdb8; letter-spacing: 0.5px;\">Frames do march<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;\">\n        <sc-for list=\"{{ sheet }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"background: #1f1f1d; border: 1px solid #2c2c29; border-radius: 10px; padding: 16px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px;\">\n            {{ f.el }}\n            <div style=\"font: 600 11px 'Pixelify Sans', monospace; color: #8a8478; letter-spacing: 0.4px;\">{{ f.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { mode: 'march', t: 0, arenaW: 680 }\n\n  componentDidMount() {\n    window.__inv = this\n    this._measure = () => {\n      const el = document.getElementById('inv-arena')\n      if (el && el.clientWidth && el.clientWidth !== this.state.arenaW) {\n        this.setState({ arenaW: el.clientWidth })\n      }\n    }\n    this._measure()\n    window.addEventListener('resize', this._measure)\n    this._iv = setInterval(() => this.setState((s) => ({ t: s.t + 1 })), 170)\n  }\n  componentWillUnmount() {\n    clearInterval(this._iv)\n    window.removeEventListener('resize', this._measure)\n  }\n\n  // ---- frames base (11×8). # = corpo, . = fundo/olho ----\n  frameA() {\n    return [\n      '..#######..',\n      '..#.###.#..',\n      '..#######..',\n      '###########',\n      '###########',\n      '..#######..',\n      '..#######..',\n      '..#.#.#.#..'\n    ]\n  }\n  frameB() {\n    return [\n      '..#######..',\n      '..#.###.#..',\n      '..#######..',\n      '.#########.',\n      '###########',\n      '#.#######.#',\n      '..#######..',\n      '.#.#...#.#.'\n    ]\n  }\n  // olhos fechados: a linha dos olhos vira corpo cheio (blink)\n  closeEyes(rows) {\n    const r = rows.slice()\n    r[1] = '..#######..'\n    return r\n  }\n\n  // estado visual (linhas + flash invertido) para um modo/tick\n  framesFor(mode, t) {\n    if (mode === 'blink') {\n      const ec = t % 5 === 0 || t % 5 === 1\n      return { rows: ec ? this.closeEyes(this.frameA()) : this.frameA(), invert: false }\n    }\n    if (mode === 'hit') {\n      return { rows: this.frameA(), invert: t % 2 === 0 }\n    }\n    if (mode === 'float') {\n      const b = Math.floor(t / 2) % 2 ? this.frameB() : this.frameA()\n      const ec = t % 16 === 0\n      return { rows: ec ? this.closeEyes(b) : b, invert: false }\n    }\n    // march / fast\n    return { rows: t % 2 ? this.frameB() : this.frameA(), invert: false }\n  }\n\n  // posição na arena\n  position(mode, t, AW, AH, sw, sh) {\n    if (mode === 'float') {\n      return { x: (AW - sw) / 2, y: (AH - sh) / 2 + Math.round(Math.sin(t * 0.5) * 12) }\n    }\n    if (mode === 'blink') {\n      return { x: (AW - sw) / 2, y: (AH - sh) / 2 }\n    }\n    if (mode === 'hit') {\n      const j = t % 2 ? 4 : -4\n      return { x: (AW - sw) / 2 + j, y: (AH - sh) / 2 }\n    }\n    // march clássico: vai-e-volta com descida em degraus, depois recomeça do topo\n    const step = mode === 'fast' ? 22 : 12\n    const span = Math.max(4, Math.floor((AW - sw - 8) / step))\n    const phase = t % (2 * span)\n    const pos = phase <= span ? phase : 2 * span - phase\n    const x = 4 + pos * step\n    const edges = Math.floor(t / span)\n    const descend = 22\n    const maxd = Math.max(1, AH - sh - 16)\n    const y = 8 + ((edges * descend) % maxd)\n    return { x: x, y: y }\n  }\n\n  spriteEl(rows, scale, invert, key) {\n    const BODY = '#C77257', BG = '#1F1F1D'\n    const body = invert ? BG : BODY\n    const bg = invert ? BODY : BG\n    const SW = 11, SH = 8\n    const rects = [React.createElement('rect', { key: 'bg', x: 0, y: 0, width: SW, height: SH, fill: bg })]\n    for (let r = 0; r < SH; r++) {\n      const line = rows[r]\n      let c = 0\n      while (c < SW) {\n        if (line[c] !== '#') { c++; continue }\n        let w = 1\n        while (c + w < SW && line[c + w] === '#') w++\n        rects.push(React.createElement('rect', { key: r + '-' + c, x: c, y: r, width: w, height: 1, fill: body }))\n        c += w\n      }\n    }\n    return React.createElement('svg', {\n      key: key, className: 'px', width: SW * scale, height: SH * scale,\n      viewBox: '0 0 ' + SW + ' ' + SH, shapeRendering: 'crispEdges',\n      style: { display: 'block', imageRendering: 'pixelated' }\n    }, rects)\n  }\n\n  renderVals() {\n    const mode = this.state.mode\n    const t = this.state.t\n    const scale = 8\n    const sw = 11 * scale, sh = 8 * scale\n\n    // largura real da arena (medida) para a march bater nas bordas visíveis\n    const arenaW = this.state.arenaW || 680\n    const arenaH = 320\n    const fr = this.framesFor(mode, t)\n    const pos = this.position(mode, t, arenaW, arenaH, sw, sh)\n\n    const arena = React.createElement(\n      'div',\n      {\n        key: 'spr',\n        style: {\n          position: 'absolute',\n          left: Math.round(pos.x) + 'px',\n          top: Math.round(pos.y) + 'px',\n          transition: mode === 'float' ? 'top 0.16s ease-in-out' : 'left 0.14s linear, top 0.2s linear',\n          willChange: 'left, top'\n        }\n      },\n      this.spriteEl(fr.rows, scale, fr.invert, 'live')\n    )\n\n    const btnBase = {\n      font: \"600 13px 'Pixelify Sans', monospace\", padding: '9px 12px', borderRadius: 8,\n      border: '1px solid #34342f', background: '#262624', color: '#ddcdb8',\n      cursor: 'pointer', textAlign: 'left', letterSpacing: '0.3px'\n    }\n    const btnActive = { border: '1px solid #c77257', background: '#c7725722', color: '#f6ece0' }\n    const defs = [\n      ['march', 'Marchar (clássico)'], ['fast', 'Marchar rápido'],\n      ['float', 'Flutuar (idle)'], ['blink', 'Piscar'], ['hit', 'Hit (flash)']\n    ]\n    const self = this\n    const modes = defs.map(function (d) {\n      return {\n        label: d[1],\n        set: function () { self.setState({ mode: d[0] }) },\n        style: mode === d[0] ? Object.assign({}, btnBase, btnActive) : btnBase\n      }\n    })\n\n    const sheetDefs = [\n      ['Frame A', this.frameA(), false],\n      ['Frame B', this.frameB(), false],\n      ['Olhos fechados', this.closeEyes(this.frameA()), false],\n      ['Hit (flash)', this.frameA(), true]\n    ]\n    const sheet = sheetDefs.map(function (d, i) {\n      return { label: d[0], el: self.spriteEl(d[1], 11, d[2], 'sheet' + i) }\n    })\n\n    return { arena: arena, modes: modes, sheet: sheet }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
