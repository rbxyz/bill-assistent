appId: com.rbueno.bill
productName: Bill Cipher - Assistant
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: .env.example
    to: .env.example
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: Mascote de desktop que conversa via Azure OpenAI
  maintainer: rbxyz <rbueno@boxdistribuidor.com.br>
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  include: build/installer.nsh
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
